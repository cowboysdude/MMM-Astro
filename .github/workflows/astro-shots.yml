name: Clean up and take screenshots (one-time)
on:
  push:
    paths: ['.github/workflows/astro-shots.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old files
        run: |
          git rm -r -q --ignore-unmatch package-lock.json renovate.json info .eslintrc .stylelintrc examples icons/1/test icons/2/test icons/3/test icons/4/test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take screenshots on a real MagicMirror
        run: |
          git clone --depth 1 https://github.com/MagicMirrorOrg/MagicMirror "$RUNNER_TEMP/mm"
          cd "$RUNNER_TEMP/mm"
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          mkdir -p modules/MMM-Astro
          cp -r "$GITHUB_WORKSPACE"/MMM-Astro.js "$GITHUB_WORKSPACE"/MMM-Astro.css "$GITHUB_WORKSPACE"/node_helper.js "$GITHUB_WORKSPACE"/icons modules/MMM-Astro/
          cat > config/config.js <<'CFG'
          let config = {
            address: "localhost", port: 8080, ipWhitelist: [], language: "en", timeFormat: 12,
            modules: [
              { module: "MMM-Astro", position: "top_left", config: { sign: "pisces", iconset: "1" } },
              { module: "MMM-Astro", position: "top_right", config: { sign: "leo", iconset: "2" } },
              { module: "MMM-Astro", position: "bottom_left", config: { sign: "aries", iconset: "3" } },
              { module: "MMM-Astro", position: "bottom_right", config: { sign: "scorpio", iconset: "4" } }
            ]
          };
          if (typeof module !== "undefined") { module.exports = config; }
          CFG
          (node --run server > /tmp/mm.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 2; done
          pip install -q playwright
          python3 - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "examples")
          os.makedirs(out, exist_ok=True)
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome")
                  pg = await b.new_page(viewport={"width": 1920, "height": 1600})
                  await pg.goto("http://localhost:8080/")
                  await pg.wait_for_function("document.querySelectorAll('.MMM-Astro .astro-lucky').length === 4", timeout=60000)
                  await pg.wait_for_timeout(2000)
                  mods = await pg.query_selector_all(".MMM-Astro")
                  for i, m in enumerate(mods):
                      await m.screenshot(path=os.path.join(out, f"iconset-{i+1}.png"))
                  await b.close()
          asyncio.run(main())
          PY
          cat /tmp/mm.log | grep -i astro || true
          ls -la "$GITHUB_WORKSPACE/examples"
      - name: Commit
        run: |
          git config user.name "cowboysdude"
          git config user.email "cowboysdude@users.noreply.github.com"
          git add examples
          git commit -m "Remove old files and add new screenshots"
          git push
